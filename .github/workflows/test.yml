name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' }}

jobs:
  unit-tests:
    name: Unit Tests
    # Adding a label re-triggers the workflow; only the full-integration label is worth a re-run.
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:full-integration'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.10.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Check formatting
        run: uv run ruff format . --check

      - name: Check lints
        run: uv run ruff check .

      - name: Run unit tests
        run: |
          uv run pytest tests/unit -v --tb=short -r fEsxX \
            --cov --cov-report=term-missing:skip-covered --cov-report=xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integration-tests:
    name: Integration Tests
    needs: unit-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: "3.10.15"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Install dependencies
        run: uv sync

      - name: Resolve test scope
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          mode=full
          if [ "${EVENT}" = "pull_request" ]; then
            case ",${LABELS}," in
              *,ci:full-integration,*) reason="label ci:full-integration" ;;
              *) reason="" ;;
            esac
            case "${HEAD_REF}" in
              release-please--branches--*) reason="release PR" ;;
            esac
            if [ -z "${reason}" ]; then
              gh pr diff "${PR_NUMBER}" --name-only > /tmp/changed.txt
              mode=affected
            fi
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
          {
            echo "### Integration test scope: ${mode}"
            if [ "${mode}" = "affected" ]; then
              echo '<details><summary>Changed files</summary>'
              echo
              echo '```'
              cat /tmp/changed.txt
              echo '```'
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Select tests
        id: select
        if: steps.scope.outputs.mode == 'affected'
        run: |
          set -o pipefail
          rc=0
          uv run python -m pytest tests/integration -p tests.utils.affected \
            --changed-files /tmp/changed.txt --collect-only -q -p no:cacheprovider \
            2>&1 | tee /tmp/select.log || rc=$?
          if [ "${rc}" -ne 0 ] && [ "${rc}" -ne 5 ]; then
            exit "${rc}"
          fi
          count=$(grep -c '::' /tmp/select.log || true)
          echo "count=${count}" >> "$GITHUB_OUTPUT"
          {
            grep '^affected-tests:' /tmp/select.log || true
            echo '<details><summary>Selected tests</summary>'
            echo
            echo '```'
            grep '::' /tmp/select.log || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run integration tests
        if: steps.scope.outputs.mode == 'full' || steps.select.outputs.count != '0'
        env:
          ALBERT_CLIENT_ID_SDK: ${{ secrets.ALBERT_CLIENT_ID_SDK }}
          ALBERT_CLIENT_SECRET_SDK: ${{ secrets.ALBERT_CLIENT_SECRET_SDK }}
          ALBERT_BASE_URL: ${{ secrets.ALBERT_BASE_URL }}
          MODE: ${{ steps.scope.outputs.mode }}
        run: |
          set -o pipefail
          args=()
          if [ "${MODE}" = "affected" ]; then
            args+=(-p tests.utils.affected --changed-files /tmp/changed.txt)
          fi
          uv run python -m pytest tests/integration -n 4 -v --tb=short -r fEsxX --durations=15 \
            "${args[@]}" 2>&1 | tee /tmp/pytest-output.log

      - name: No affected tests
        if: steps.scope.outputs.mode == 'affected' && steps.select.outputs.count == '0'
        run: echo "No integration tests are affected by this change." >> "$GITHUB_STEP_SUMMARY"

      - name: Post failure summary
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f /tmp/pytest-output.log ]; then
            SUMMARY=$(sed -n '/short test summary info/,$p' /tmp/pytest-output.log | head -c 50000)
            if [ -z "${SUMMARY}" ]; then
              SUMMARY=$(tail -c 50000 /tmp/pytest-output.log)
            fi
          else
            SUMMARY="The Integration Tests job failed before the pytest step ran. See the build log for the failing step."
          fi

          SHORT_SHA="${SHA:0:8}"
          COMMENT_BODY=$(jq -n \
            --arg branch "${BRANCH}" \
            --arg sha "${SHORT_SHA}" \
            --arg url "${RUN_URL}" \
            --arg summary "${SUMMARY}" \
            '("### Integration Tests failed\n\n**Branch:** `" + $branch + "` (" + $sha + ")\n**Build:** " + $url + "\n\n```\n" + $summary + "\n```")')

          echo "$COMMENT_BODY" | jq -r . >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${PR_NUMBER}" ]; then
            gh pr comment "${PR_NUMBER}" --body "$(echo "$COMMENT_BODY" | jq -r .)" || echo "Failed to post PR comment"
          fi
