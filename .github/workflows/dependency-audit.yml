name: Dependency audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/next' }}

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with lambda_runtimes in .circleci/config.yml.
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}

      - name: Audit runtime dependencies
        env:
          AUDIT_PYTHON: ${{ matrix.python-version }}
        run: bash scripts/audit_dependencies.sh
